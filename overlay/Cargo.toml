[package]
name = "dsxinput-overlay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Explicit Vulkan version overlay layer for dsxinput"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
ash.workspace = true
egui.workspace = true
egui-ash-renderer.workspace = true

[build-dependencies]
naga = { version = "=29.0.1", default-features = false, features = ["wgsl-in", "spv-out"] }
